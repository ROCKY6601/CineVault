name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          ROOT="$PWD"
          FILE=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ] && ls ./*.zip >/dev/null 2>&1; then
            mkdir -p /tmp/src
            for z in ./*.zip; do unzip -oq "$z" -d /tmp/src; done
            FILE=$(find /tmp/src -name settings.gradle.kts | head -n 1)
          fi
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts nahi mili. Repo files:"
            find . -not -path './.git/*' | head -50
            exit 1
          fi
          cd "$(dirname "$FILE")"
          set +e
          gradle assembleDebug --no-daemon --console=plain > "$ROOT/build.log" 2>&1
          CODE=$?
          set -e
          if [ $CODE -ne 0 ]; then
            echo "=========== ASLI ERROR ==========="
            grep -E "^e: |What went wrong|Execution failed|error:|Could not" -A3 "$ROOT/build.log" | head -40
            exit 1
          fi
          mkdir -p "$ROOT/out"
          find . -name app-debug.apk -exec cp {} "$ROOT/out/" \;
      - uses: actions/upload-artifact@v4
        with:
          name: CineVault-debug-apk
          path: out/app-debug.apk
